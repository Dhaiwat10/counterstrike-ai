[project]
name = "cs16env"
version = "0.1.0"
description = "RL environment for Counter-Strike 1.6 on a lockstep-patched Xash3D FWGS"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "gymnasium>=1.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
train = ["torch>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cs16env"]
