<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS AI Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0c10; --card: #12141a; --card2: #191c24; --line: #22252e; --text: #eef0f4; --muted: #8a91a0; --faint: #5b6170;
    --accent: #7c9cff; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --exam: #c084fc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }

  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .top h1 { font-size: 16px; font-weight: 600; margin: 0 4px 0 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .live { background: var(--ok); animation: pulse 2s infinite; }
  .dead { background: var(--bad); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,.45); } 50% { box-shadow: 0 0 0 6px rgba(52,211,153,0); } }
  .chip { background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .spacer { flex: 1; }

  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }
  .big { font-size: 60px; font-weight: 600; line-height: 1; }
  .need { font-size: 13px; color: var(--muted); line-height: 1.5; padding-bottom: 6px; }
  .bar { position: relative; height: 10px; background: var(--card2); border-radius: 999px; margin-top: 34px; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, #5b7cff, #a5b8ff); transition: width .6s; }
  .bar .mark { position: absolute; top: -6px; width: 2px; height: 22px; background: var(--warn); border-radius: 2px; }
  .bar .marklbl { position: absolute; top: -26px; transform: translateX(-50%); font-size: 11px; color: var(--warn); }
  .wins { display: flex; align-items: flex-end; gap: 6px; height: 92px; margin-top: 14px; position: relative; }
  .wins .w { flex: 1; border-radius: 6px 6px 3px 3px; min-width: 10px; }
  .wins .w.pass { background: rgba(52,211,153,.6); } .wins .w.fail { background: rgba(124,156,255,.4); }
  .wins .gl { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--warn); opacity: .7; pointer-events: none; }
  .winvals { display: flex; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .winvals span { flex: 1; text-align: center; min-width: 10px; }
  .passes { display: flex; gap: 8px; align-items: center; }
  .pdot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #343846; }
  .pdot.on { background: var(--ok); border-color: var(--ok); }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .kpi .v { font-size: 26px; font-weight: 600; margin-top: 6px; }
  .kpi .sp { height: 34px; margin-top: 8px; position: relative; }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .chartbox { height: 240px; margin-top: 10px; position: relative; }

  .strip { display: grid; grid-template-columns: repeat(22, 1fr); gap: 4px; margin-top: 14px; }
  .seg { height: 28px; border-radius: 6px; background: var(--card2); position: relative; }
  .seg.done { background: rgba(52,211,153,.32); } .seg.cur { background: var(--accent); box-shadow: 0 0 0 3px rgba(124,156,255,.25); }
  .seg span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; color: var(--muted); }
  .seg.done span { color: #b5f0d8; } .seg.cur span { color: #0b0c10; font-weight: 700; }
  .groups { display: grid; grid-template-columns: 4fr 7fr 5fr 1fr 5fr; gap: 4px; margin-top: 6px; font-size: 11px; color: var(--faint); }
  .groups div { border-top: 1px solid var(--line); padding-top: 4px; white-space: nowrap; overflow: hidden; }

  [data-tip] { position: relative; cursor: default; }
  [data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 50%; transform: translateX(-50%); bottom: 100%; margin-bottom: 8px; background: #000; color: var(--text); font: 500 12px Inter, sans-serif; text-transform: none; letter-spacing: 0; padding: 6px 9px; border-radius: 8px; white-space: nowrap; z-index: 9; border: 1px solid var(--line); }
  .label[data-tip]:hover::after { left: 0; transform: none; }
  @media (max-width: 900px) { .hero, .charts { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(3, 1fr); } .big { font-size: 46px; } .groups { display: none; } .strip { grid-template-columns: repeat(11, 1fr); } }
  @media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span id="status" class="dot dead"></span>
    <h1>aim_bc</h1>
    <span class="chip" id="stagechip">—</span>
    <span class="chip num" id="steps">—</span>
    <span class="chip num" id="sps">—</span>
    <span class="spacer"></span>
    <span class="faint num" style="font-size:12px" id="updated"></span>
  </div>

  <div class="hero">
    <div class="card">
      <div class="label" data-tip="Kill rate in the last 200 counted rounds (distance stages: newest band only)">Promotion kill rate</div>
      <div style="display:flex;align-items:flex-end;gap:16px;margin-top:12px">
        <div class="big num" id="prom">—</div>
        <div class="need" id="promsub"></div>
      </div>
      <div class="bar"><div class="fill" id="promfill"></div><div class="mark" id="promark"></div><div class="marklbl num" id="promarklbl"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px">
        <div class="passes" id="passes"></div>
        <div class="faint num" style="font-size:12px" id="fill"></div>
      </div>
    </div>
    <div class="card">
      <div class="label">Recent windows · 200 rounds each</div>
      <div class="wins" id="wins"></div>
      <div class="winvals num" id="winvals"></div>
    </div>
  </div>

  <div class="kpis">
    <div class="card kpi"><div class="label" data-tip="All rounds, latest update">Kill rate</div><div class="v num" id="k_kill">—</div><div class="sp"><canvas id="s_kill"></canvas></div></div>
    <div class="card kpi"><div class="label">Deaths</div><div class="v num" id="k_death">—</div><div class="sp"><canvas id="s_death"></canvas></div></div>
    <div class="card kpi"><div class="label" data-tip="Median time until the crosshair is on the bot">Time to target</div><div class="v num" id="k_acq">—</div><div class="sp"><canvas id="s_acq"></canvas></div></div>
    <div class="card kpi"><div class="label" data-tip="Kill rate on replays of earlier stages">Rehearsal</div><div class="v num" id="k_reh">—</div><div class="sp"><canvas id="s_reh"></canvas></div></div>
    <div class="card kpi"><div class="label" data-tip="Kill rate on rounds with a random 40/80 ms delay">With delay</div><div class="v num" id="k_dly">—</div><div class="sp"><canvas id="s_dly"></canvas></div></div>
    <div class="card kpi"><div class="label" data-tip="Bot left sight; round not counted">No-contest</div><div class="v num" id="k_nc">—</div><div class="sp"><canvas id="s_nc"></canvas></div></div>
  </div>

  <div class="charts">
    <div class="card"><div class="label" data-tip="Same 100 test rounds every 30 min">Exam kill rate</div><div class="chartbox"><canvas id="c_exam"></canvas></div></div>
    <div class="card"><div class="label">Training kill rate</div><div class="chartbox"><canvas id="c_kill"></canvas></div></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div class="label">Curriculum</div><div class="muted" style="font-size:12px" id="curtext"></div></div>
    <div class="strip" id="strip"></div>
    <div class="groups"><div>Bot</div><div>Aim angle</div><div>Distance</div><div>★</div><div>Reaction delay</div></div>
  </div>
</div>

<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pct = v => v == null ? '—' : Math.round(100 * v) + '%';
const $ = id => document.getElementById(id);
const charts = {};
Chart.defaults.color = '#8a91a0'; Chart.defaults.font.family = 'Inter'; Chart.defaults.borderColor = '#22252e';

function upsert(id, cfg) {
  if (charts[id]) { charts[id].data = cfg.data; charts[id].options = cfg.options; charts[id].update('none'); }
  else charts[id] = new Chart($(id), cfg);
}
function spark(id, data, color, max) {
  upsert(id, { type: 'line', data: { labels: data.map((_, i) => i), datasets: [{ data, borderColor: color, borderWidth: 1.5, pointRadius: 0, tension: .35, fill: true, backgroundColor: color + '1f' }] },
    options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false, min: 0, max } } } });
}
Chart.register({ id: 'marks', afterDatasetsDraw(c) {
  const o = c.options.plugins.marks || {}, x = c.scales.x, a = c.chartArea, ctx = c.ctx; ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.setLineDash([3, 4]);
  (o.stages || []).forEach(v => { const px = x.getPixelForValue(v); if (px > a.left && px < a.right) { ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); } });
  if (o.gate != null) { const y = c.scales.y.getPixelForValue(o.gate); ctx.setLineDash([5, 4]); ctx.strokeStyle = css('--warn'); ctx.globalAlpha = .75; ctx.beginPath(); ctx.moveTo(a.left, y); ctx.lineTo(a.right, y); ctx.stroke(); }
  ctx.restore(); } });
function line(id, datasets, stages, gate) {
  upsert(id, { type: 'line', data: { datasets }, options: { animation: false, responsive: true, maintainAspectRatio: false, parsing: false,
    interaction: { mode: 'nearest', intersect: false },
    plugins: { legend: { display: datasets.length > 1, align: 'end', labels: { boxWidth: 8, boxHeight: 8, usePointStyle: true, pointStyle: 'circle' } }, marks: { stages, gate },
      tooltip: { callbacks: { title: c => (c[0].parsed.x / 1e6).toFixed(2) + 'M steps', label: c => ` ${c.dataset.label}: ${Math.round(c.parsed.y * 100)}%` } } },
    scales: { x: { type: 'linear', grid: { display: false }, ticks: { callback: v => (v / 1e6).toFixed(1) + 'M', maxTicksLimit: 6 } },
              y: { min: 0, max: 1, grid: { color: '#1a1d24' }, border: { display: false }, ticks: { callback: v => v * 100 + '%', stepSize: .25 } } } } });
}
const BOT = ['still', 'strafing', 'still · shoots', 'moving · shoots'];
const short = s => `${BOT[s.bot]} · ${s.offset_min ? s.offset_min + '–' + s.offset : '≤' + s.offset}° · ${s.dist}u · ${Math.round(s.delay * 1000)} ms · pass ${Math.round(s.gate * 100)}%`;

async function refresh() {
  let s; try { s = await (await fetch('/api/state', { cache: 'no-store' })).json(); } catch (e) { $('updated').textContent = 'offline'; $('status').className = 'dot dead'; return; }
  const r = s.runs[0], L = r.latest || {}, cur = r.stage ?? 0, st = s.stages[cur], gate = r.gate ?? .5;
  $('status').className = 'dot ' + (r.alive && (r.log_age_s ?? 999) < 300 ? 'live' : 'dead');
  $('stagechip').innerHTML = `<b>Stage ${cur + 1}</b> / ${s.stages.length} · ${st.dist}u · ${Math.round(st.delay * 1000)} ms`;
  $('steps').textContent = ((L.steps || 0) / 1e6).toFixed(2) + 'M steps';
  $('sps').textContent = Math.round(L.sps || 0) + ' steps/s';
  $('updated').textContent = s.now.slice(11, 16) + (s.exam_alive ? '' : ' · exams off');

  // promotion
  const W = r.windows || [], last = W.length ? W[W.length - 1].kill : null;
  $('prom').textContent = pct(last);
  $('promsub').innerHTML = `of <b class="num" style="color:var(--warn)">${pct(gate)}</b><br>needed twice`;
  $('promfill').style.width = Math.min(100, 100 * (last || 0)) + '%';
  $('promark').style.left = $('promarklbl').style.left = 100 * gate + '%';
  $('promarklbl').textContent = pct(gate);
  const p = L.passes ?? 0;
  $('passes').innerHTML = [0, 1].map(i => `<span class="pdot ${i < p ? 'on' : ''}"></span>`).join('') + `<span class="muted" style="font-size:12px;margin-left:2px">${p}/2</span>`;
  $('fill').textContent = `next window ${L.window_fill ?? 0}/200`;
  $('wins').innerHTML = W.map(w => `<div class="w ${w.kill > gate ? 'pass' : 'fail'}" data-tip="${pct(w.kill)} at ${(w.steps / 1e6).toFixed(2)}M" style="height:${Math.max(4, 100 * w.kill)}%"></div>`).join('')
    + `<div class="gl" style="bottom:${100 * gate}%"></div>`;
  $('winvals').innerHTML = W.map(w => `<span>${pct(w.kill)}</span>`).join('');

  // kpis
  const H = r.hist.slice(-80), f = k => H.map(h => h[k]).filter(v => v != null);
  $('k_kill').textContent = pct(L.kill_rate); spark('s_kill', f('kill_rate'), css('--accent'), 1);
  $('k_death').textContent = pct(L.death_rate); spark('s_death', f('death_rate'), css('--bad'), 1);
  $('k_acq').textContent = L.acquire_time_med != null ? L.acquire_time_med.toFixed(2) + 's' : '—'; spark('s_acq', f('acquire_time_med'), css('--ok'), undefined);
  $('k_reh').textContent = pct(L.kill_rehearsal); spark('s_reh', f('kill_rehearsal'), css('--ok'), 1);
  $('k_dly').textContent = pct(L.kill_delayed); spark('s_dly', f('kill_delayed'), css('--warn'), 1);
  $('k_nc').textContent = pct(L.no_contest_rate); spark('s_nc', f('no_contest_rate'), css('--faint'), 1);

  // charts
  const stages = r.curriculum.map(c => c.steps);
  const cur1 = `stage${cur + 1}`;
  const exNow = r.exams.filter(e => e[cur1]).map(e => ({ x: e.steps, y: e[cur1].kill_rate }));
  const exNext = r.exams.filter(e => e[`stage${cur + 2}_next`]).map(e => ({ x: e.steps, y: e[`stage${cur + 2}_next`].kill_rate }));
  line('c_exam', [
    { label: `stage ${cur + 1}`, data: exNow, borderColor: css('--exam'), backgroundColor: css('--exam'), pointRadius: 3, borderWidth: 2, tension: .3 },
    { label: `stage ${cur + 2}`, data: exNext, borderColor: '#5b6170', backgroundColor: '#5b6170', pointRadius: 2, borderWidth: 1.5, tension: .3, borderDash: [4, 3] },
  ], stages, gate);
  const t0 = exNow.length ? exNow[0].x : 0, from = Math.min(t0, r.hist.length ? r.hist[Math.max(0, r.hist.length - 600)].steps : 0);
  const hk = r.hist.filter(h => h.steps >= from && h.kill_rate != null);
  line('c_kill', [{ label: 'kill rate', data: hk.map(h => ({ x: h.steps, y: h.kill_rate })), borderColor: css('--accent'), pointRadius: 0, borderWidth: 1.5, tension: .3 }], stages, gate);

  // curriculum
  $('strip').innerHTML = s.stages.map(x => `<div class="seg ${x.i < cur ? 'done' : x.i === cur ? 'cur' : ''}" data-tip="${x.i + 1} · ${short(x)}"><span>${x.i + 1}</span></div>`).join('');
  $('curtext').textContent = short(st);
}
refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
