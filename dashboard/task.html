<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firing fix</title>
<style>
  :root { --bg:#0c0d0f; --panel:#131418; --line:#23252b; --line2:#2d3037; --ink:#ededef; --mute:#8b8f98; --faint:#5c606a;
          --good:#4cc38a; --bad:#e5604c; --blue:#5aa2f5; --amber:#e2a336; --track:#1d1f24; --zone:rgba(76,195,138,.16); }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fbfbfa; --panel:#ffffff; --line:#e9e9e7; --line2:#dcdcd9; --ink:#1b1c1e; --mute:#6c7079; --faint:#a3a6ad;
            --good:#1f9d63; --bad:#cf4a35; --blue:#2f7fe0; --amber:#b97f10; --track:#efefed; --zone:rgba(31,157,99,.14); }
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, "SF Pro Text", "Inter", "Segoe UI", sans-serif; letter-spacing:-.005em; font-variant-numeric:tabular-nums; }
  main { max-width:1100px; margin:0 auto; padding:22px 20px 60px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  h1 { font-size:19px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .spacer { flex:1; }
  .chip { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px; border:1px solid var(--line); border-radius:6px; color:var(--mute); white-space:nowrap; }
  .chip b { color:var(--ink); font-weight:500; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none; }
  .dot.live { background:var(--good); box-shadow:0 0 0 3px rgba(76,195,138,.18); animation:p 1.8s ease-in-out infinite; }
  @keyframes p { 50% { box-shadow:0 0 0 6px rgba(76,195,138,0); } }
  .score { display:flex; align-items:center; gap:10px; }
  .score .n { font-size:19px; font-weight:600; } .score .n span { color:var(--mute); font-weight:400; }
  .segs { display:flex; gap:3px; } .segs i { width:14px; height:6px; border-radius:2px; background:var(--track); } .segs i.ok { background:var(--good); } .segs i.no { background:var(--bad); opacity:.75; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:12px; }
  .head { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); color:var(--mute); font-size:15px; }
  .head .t { color:var(--ink); font-weight:500; }
  .key { display:inline-flex; align-items:center; gap:5px; margin-left:12px; color:var(--faint); font-size:14.5px; }
  .key i { display:inline-block; }
  /* targets */
  .row { display:grid; grid-template-columns:210px 1fr 170px 16px; align-items:center; gap:14px; padding:9px 14px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .l { color:var(--ink); } .row .l small { display:block; color:var(--faint); font-size:14px; margin-top:1px; }
  .track { position:relative; height:8px; border-radius:4px; background:var(--track); }
  .zone { position:absolute; top:0; bottom:0; background:var(--zone); border-radius:4px; }
  .fill { position:absolute; top:0; bottom:0; left:0; border-radius:4px; background:var(--mute); transition:width .5s ease; }
  .fill.ok { background:var(--good); } .fill.no { background:var(--ink); opacity:.8; } .fill.ghost { background:var(--faint); opacity:.55; }
  .tick { position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--amber); border-radius:1px; }
  .tick.t { background:transparent; border-left:2px dotted var(--blue); width:0; }
  .goal { position:absolute; top:-4px; bottom:-4px; width:1px; background:var(--good); }
  .v { text-align:right; white-space:nowrap; } .v b { font-size:17.5px; font-weight:600; } .v span { color:var(--faint); margin-left:6px; font-size:14.5px; }
  .st { width:8px; height:8px; border-radius:50%; background:var(--line2); } .st.ok { background:var(--good); } .st.no { background:var(--bad); }
  /* chart */
  .chart { padding:10px 14px 6px; } svg { width:100%; height:170px; display:block; }
  /* table */
  table { width:100%; border-collapse:collapse; }
  th, td { padding:10px 14px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  th { color:var(--faint); font-weight:400; font-size:14.5px; } th:first-child, td:first-child { text-align:left; }
  td.ok { color:var(--good); } td.no { color:var(--bad); } td.na { color:var(--faint); }
  td.name { color:var(--ink); max-width:260px; overflow:hidden; text-overflow:ellipsis; } tr.ref td { color:var(--mute); }
  .tag { display:inline-block; font-size:13px; color:var(--faint); border:1px solid var(--line2); border-radius:4px; padding:0 5px; margin-left:6px; }
  pre { margin:0; padding:12px 14px; white-space:pre-wrap; word-break:break-word; font:14.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color:var(--mute); max-height:300px; overflow:auto; }
  .empty { padding:18px 14px; color:var(--faint); }
  .wrap { overflow-x:auto; }
  @media (max-width:640px) { .row { grid-template-columns:110px 1fr 96px 10px; gap:10px; } .v span { display:none; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="dot" id="live"></span><h1>Firing fix</h1>
    <span class="chip" id="c-run" hidden></span><span class="chip" id="c-meas" hidden></span>
    <span class="spacer"></span>
    <div class="score"><div class="segs" id="segs"></div><div class="n" id="met"></div></div>
  </header>

  <section>
    <div class="head"><span class="t">Targets</span><span id="who"></span><span class="spacer"></span>
      <span class="key"><i style="width:2px;height:10px;background:var(--amber)"></i>today</span>
      <span class="key"><i style="width:0;height:10px;border-left:2px dotted var(--blue)"></i>teacher</span>
      <span class="key"><i style="width:14px;height:6px;border-radius:2px;background:var(--zone)"></i>goal</span></div>
    <div id="rows"></div>
  </section>

  <section>
    <div class="head"><span class="t">Training</span><span id="runname"></span><span class="spacer"></span>
      <span class="key"><i class="dot" style="background:var(--ink)"></i>all</span><span class="key"><i class="dot" style="background:var(--good)"></i>close</span>
      <span class="key"><i class="dot" style="background:var(--amber)"></i>medium</span><span class="key"><i class="dot" style="background:var(--bad)"></i>long</span></div>
    <div class="chart"><svg id="chart" viewBox="0 0 1000 170" preserveAspectRatio="none"></svg></div>
  </section>

  <section>
    <div class="head"><span class="t">Attempts</span><span id="nattempts"></span></div>
    <div class="wrap"><table id="attempts"></table></div>
  </section>

  <section>
    <div class="head" id="noteshead" style="cursor:pointer;border-bottom:0"><span class="t">Notes</span><span id="lastnote" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0"></span><span class="spacer"></span><span id="logage" style="white-space:nowrap"></span><span id="chev">▸</span></div>
    <pre id="log" hidden style="border-top:1px solid var(--line)"></pre>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = s => s == null ? '' : s < 90 ? Math.round(s) + 's ago' : s < 5400 ? Math.round(s / 60) + 'm ago' : (s / 3600).toFixed(1) + 'h ago';
const P0 = v => Math.round(100 * v) + '%', D2 = v => v.toFixed(2) + '°', N1 = v => v.toFixed(1);
const F = k => d => d.while_firing[k];
// id, label, hint, kind, getter | exam key, lower-is-better, target, format
const M = [
  ['jit',  'Vertical jitter',  'share of shots fired while moving up/down', 'f', F('pitch_moved_share'), true, .35, P0],
  ['size', 'Jitter size',      'up/down movement per shot',                 'f', F('pitch_move_mean_abs'), true, .4, D2],
  ['offx', 'Off target ↔',     'sideways miss when firing',                 'f', F('aim_err_yaw_abs'), true, .8, D2],
  ['offy', 'Off target ↕',     'vertical miss when firing',                 'f', F('aim_err_pitch_abs'), true, .8, D2],
  ['spk',  'Shots per kill',   'firing steps per kill',                     'f', d => d.shots_per_kill_steps, true, 5.5, N1],
  ['long', 'Long range',       'wins beyond 1,050 units',                   'e', ['aim_aimmap', 1050, 1800, 3], false, .60, P0],
  ['norm', 'Normal range',     'wins up to 1,050 units',                    'e', ['aim_aimmap', 0, 1050, 3], false, .90, P0],
];
function exam(R, label, [scn, lo, hi, bot]) {
  const seen = {};
  for (const r of R) { const d = r.data || {};
    if (r.kind === 'exam' && r.label === label && d.scenario === scn && d.dist && d.dist[0] === lo && d.dist[1] === hi && (d.bot ?? 3) === bot) seen[d.seed + ':' + d.rounds] = d; }
  let k = 0, n = 0; for (const d of Object.values(seen)) { k += d.kill_rate * d.rounds; n += d.rounds; }
  return n ? { v: k / n, n } : null;
}
function firing(R, label) { let o = null; for (const r of R) if (r.kind === 'firing' && r.label === label) o = r.data; return o; }
function val(R, label, m) {
  try { if (m[3] === 'f') { const d = firing(R, label); return d ? { v: m[4](d) } : null; } return exam(R, label, m[4]); } catch (e) { return null; }
}
const pass = (m, v) => m[5] ? v <= m[6] : v >= m[6];

function render(s) {
  const R = s.results, tr = s.processes.filter(p => p.kind === 'training'), ms = s.processes.filter(p => p.kind !== 'training');
  const labels = []; for (const r of R) if (!['baseline', 'teacher'].includes(r.label) && !labels.includes(r.label)) labels.push(r.label);
  const cur = labels.length ? labels[labels.length - 1] : null;
  // header
  $('live').className = 'dot' + (s.processes.length ? ' live' : '');
  const run = s.run, last = run && run.points.length ? run.points[run.points.length - 1] : null;
  $('c-run').hidden = !tr.length;
  if (tr.length) $('c-run').innerHTML = `<b>${esc(tr[0].name)}</b>${esc(tr[0].elapsed)}${last ? ` · ${Math.round(last.sps || 0)}/s` : ''}`;
  $('c-meas').hidden = !ms.length;
  if (ms.length) { $('c-meas').innerHTML = `<b>${ms.length}</b>measuring`; $('c-meas').title = ms.map(p => p.kind + ' ' + p.args).join('\n'); }
  document.title = (s.processes.length ? '● ' : '') + 'Firing fix';
  // targets
  let html = '', met = 0, segs = '';
  for (const m of M) {
    const b = val(R, 'baseline', m), t = val(R, 'teacher', m), c = cur ? val(R, cur, m) : null;
    const lower = m[5], goal = m[6], fmt = m[7];
    const max = lower ? Math.max(goal, b ? b.v : 0, c ? c.v : 0, t ? t.v : 0) * 1.08 : 1;
    const x = v => Math.max(0, Math.min(100, 100 * v / max));
    const shown = c || b, ok = c ? pass(m, c.v) : null;
    if (ok) met++;
    segs += `<i class="${ok == null ? '' : ok ? 'ok' : 'no'}" title="${esc(m[1])}"></i>`;
    const zone = lower ? `left:0;width:${x(goal)}%` : `left:${x(goal)}%;right:0`;
    const tip = `${m[1]}: ${m[2]}\ntoday ${b ? fmt(b.v) : '–'} · teacher ${t ? fmt(t.v) : '–'} · goal ${lower ? '≤' : '≥'} ${fmt(goal)}${c ? `\n${cur}: ${fmt(c.v)}${c.n ? ' (' + c.n + ' rounds)' : ''}` : ''}`;
    html += `<div class="row" title="${esc(tip)}"><div class="l">${m[1]}<small>${m[2]}</small></div>
      <div class="track"><div class="zone" style="${zone}"></div>
        ${shown ? `<div class="fill ${c ? (ok ? 'ok' : 'no') : 'ghost'}" style="width:${x(shown.v)}%"></div>` : ''}
        <div class="goal" style="left:${x(goal)}%"></div>
        ${b ? `<div class="tick" style="left:${x(b.v)}%"></div>` : ''}${t ? `<div class="tick t" style="left:${x(t.v)}%"></div>` : ''}</div>
      <div class="v"><b>${shown ? fmt(shown.v) : '–'}</b><span>${lower ? '≤' : '≥'} ${fmt(goal)}</span></div><div class="st ${ok == null ? '' : ok ? 'ok' : 'no'}"></div></div>`;
  }
  $('rows').innerHTML = html; $('segs').innerHTML = segs;
  $('met').innerHTML = cur ? `${met}<span> / ${M.length}</span>` : `<span>0 / ${M.length}</span>`;
  $('who').textContent = cur ? cur : 'no attempt measured yet';
  // chart
  let g = '';
  for (const y of [0, .5, 1]) g += `<line x1="0" x2="1000" y1="${158 - 150 * y}" y2="${158 - 150 * y}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>`;
  if (run && run.points.length > 1) {
    const Pt = run.points, u0 = Pt[0].update, u1 = Pt[Pt.length - 1].update, X = u => 1000 * (u - u0) / Math.max(1, u1 - u0);
    for (const [k, col, w] of [['kill_long', 'var(--bad)', 1.2], ['kill_medium', 'var(--amber)', 1.2], ['kill_close', 'var(--good)', 1.2], ['kill_rate', 'var(--ink)', 2]]) {
      const pts = Pt.filter(p => p[k] != null).map(p => `${X(p.update).toFixed(1)},${(158 - 150 * p[k]).toFixed(1)}`).join(' ');
      if (pts) g += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    }
    const k = run.knobs || {};
    $('runname').textContent = `${run.name} · ${u1 - u0} updates${k.dist ? ` · to ${k.dist} units` : ''}${tr.length ? '' : ' · stopped ' + ago(run.age_s)}`;
  } else $('runname').textContent = run ? run.name : '';
  $('chart').innerHTML = g;
  // attempts
  const cols = [['Long', M[5]], ['Normal', M[6]], ['Jitter', M[0]], ['Size', M[1]], ['Miss ↕', M[3]], ['Shots/kill', M[4]]];
  let t = `<tr><th>Model</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}<th>Whole map</th><th>Passive</th><th></th></tr>`;
  const line = (label, name, ref) => {
    let ok = 0, any = 0, cells = '';
    for (const [, m] of cols) { const v = val(R, label, m); if (!v) { cells += '<td class="na">·</td>'; continue; }
      const p = pass(m, v.v); any++; if (p) ok++; cells += `<td class="${ref ? '' : p ? 'ok' : 'no'}" title="${v.n ? v.n + ' rounds' : ''}">${m[7](v.v)}</td>`; }
    for (const key of [['aim_aimmap', 0, 1800, 3], ['aim_aimmap', 1050, 1800, 1]]) { const v = exam(R, label, key); cells += v ? `<td title="${v.n} rounds">${P0(v.v)}</td>` : '<td class="na">·</td>'; }
    return `<tr class="${ref ? 'ref' : ''}"><td class="name">${esc(name)}${label === cur ? '<span class="tag">latest</span>' : ''}</td>${cells}<td>${ref || !any ? '' : `${ok}/${any}`}</td></tr>`;
  };
  for (const l of labels.slice().reverse()) t += line(l, l, false);
  t += line('baseline', 'Today\'s model', true) + line('teacher', 'Scripted teacher', true);
  $('attempts').innerHTML = t; $('nattempts').textContent = labels.length ? labels.length : '';
  // notes
  const text = s.log.trim(), log = $('log');
  const heads = text.split('\n').filter(l => /^#+\s/.test(l));
  $('lastnote').textContent = text ? (heads.length ? heads[heads.length - 1].replace(/^#+\s*/, '') : '') : 'none yet';
  $('logage').textContent = text ? ago(s.log_age_s) : '';
  log.hidden = !notesOpen || !text; $('chev').textContent = notesOpen ? '▾' : '▸';
  if (text && log.textContent !== text) { const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 30 || !log.textContent; log.textContent = text; if (stick) log.scrollTop = log.scrollHeight; }
}
let notesOpen = false, lastState = null;
$('noteshead').onclick = () => { notesOpen = !notesOpen; if (lastState) render(lastState); const l = $('log'); l.scrollTop = l.scrollHeight; };
async function tick() { try { lastState = await (await fetch('/api/state', { cache: 'no-store' })).json(); render(lastState); } catch (e) { $('live').className = 'dot'; } }
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
