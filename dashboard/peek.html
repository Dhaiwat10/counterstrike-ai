<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay home</title>
<style>
:root{--bg:#0e0f12;--card:#17191e;--line:#262a32;--text:#e9eaee;--dim:#9097a3;--good:#3ecf8e;--bad:#f0616d;--wait:#6b7280;--accent:#f2c14e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:10px;height:36px}
header h1{font-size:14px;font-weight:600;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--line);border-radius:6px;color:var(--dim);font-size:12px;background:var(--card)}
.chip b{color:var(--text);font-weight:500}.sp{flex:1}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--wait)}.pulse.on{background:var(--good);box-shadow:0 0 0 0 rgba(62,207,142,.6);animation:p 1.8s infinite}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(62,207,142,0)}100%{box-shadow:0 0 0 0 rgba(62,207,142,0)}}
.seg{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin:14px 0 6px}.seg i{display:block;height:100%;border-radius:2px}
.counts{display:flex;gap:16px;color:var(--dim);font-size:12px;margin-bottom:18px}.counts span{display:inline-flex;align-items:center;gap:6px}.counts b{color:var(--text);font-weight:500}
.group{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--card);border:1px solid var(--line);border-radius:8px 8px 0 0;font-size:12px;font-weight:500;margin-top:18px}
.group .n{color:var(--dim);font-weight:400}.group .lg{margin-left:auto;display:flex;gap:14px;color:var(--dim);font-weight:400}
.group .lg span{display:inline-flex;align-items:center;gap:5px}
.list{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;overflow:hidden}
.mark{display:grid;grid-template-columns:260px 1fr;gap:14px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.hd+.mark{border-top:0}
.nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:9px;line-height:1.25}
.sdot{width:9px;height:9px;border-radius:50%;flex:none}
.row{display:grid;grid-template-columns:72px 1fr 58px 62px 62px;align-items:center;gap:12px;height:28px}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.hd{display:grid;grid-template-columns:260px 1fr;gap:14px;padding:8px 14px 0}.hd .row{height:18px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}.hd .row span{text-align:right}
.endtag{font-size:12px;color:var(--dim)}
.val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}.val small{color:var(--dim);font-weight:400;font-size:11px;margin-right:6px}
.val.g{color:var(--good)}.val.r{color:var(--bad)}.val.w{color:var(--wait);font-weight:400;font-size:12px}
.track{position:relative;height:18px}
.track .base{position:absolute;left:0;right:0;top:8px;height:2px;background:var(--line);border-radius:1px}
.track .zone{position:absolute;top:5px;height:8px;background:rgba(62,207,142,.16);border-radius:2px}
.track .tick{position:absolute;top:2px;width:1px;height:14px;background:var(--good);opacity:.7}
.track .link{position:absolute;top:8px;height:2px;opacity:.55}
.track .was{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:1.5px solid var(--dim);background:var(--bg)}
.track .now{position:absolute;top:3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;box-shadow:0 0 0 3px var(--bg)}
.ic{width:14px;height:14px}
.dotl{width:9px;height:9px;border-radius:50%;display:inline-block}.ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);display:inline-block}
.zl{width:14px;height:8px;border-radius:2px;background:rgba(62,207,142,.25);display:inline-block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}.mark{grid-template-columns:1fr;gap:6px}}
.panel{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:12px}
.bar{display:grid;grid-template-columns:120px 1fr 54px;align-items:center;gap:10px;height:26px}.bar .l{color:var(--dim)}
.bar .t{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar .t i{display:block;height:100%;border-radius:4px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bh{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}.bh:first-child{margin-top:0}
svg.sp{width:100%;height:84px;display:block}
.cap{display:flex;gap:12px;color:var(--dim);font-size:11px;margin-bottom:4px;align-items:center}.cap b{color:var(--text);font-weight:500;font-size:12px;margin-right:auto}
.cap span{display:inline-flex;align-items:center;gap:5px}.ln{width:12px;height:2px;display:inline-block;border-radius:1px}
footer{margin-top:22px;color:var(--dim);font-size:12px}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
</style></head><body><main>
<header><h1>Stay home</h1><span class="chip"><span id="pulse" class="pulse"></span><b id="run">–</b><span id="upd"></span></span><span class="chip" id="examchip" style="display:none"></span><span class="sp"></span><span class="chip" id="eng"></span></header>
<div class="seg" id="seg"></div>
<div class="counts" id="counts"></div>

<div class="group">Pass marks <span class="n" id="nmarks" style="display:none"></span><span class="lg"><span><i class="ring"></i>before</span><span><i class="dotl" style="background:var(--text)"></i>latest exam</span><span><i class="zl"></i>pass zone</span></span></div>
<div class="list" id="list"></div>

<div class="two">
  <div><div class="group">You vs the model <span class="n">real duels</span></div><div class="panel" id="cmp"></div></div>
  <div><div class="group">Training, live <span class="n">not exams</span></div><div class="panel" id="charts"></div></div>
</div>
<footer><a href="/peek_full.html">Tables, films, log</a> · <a href="/sides">Previous phase</a></footer>
</main>
<script>
const $=id=>document.getElementById(id),C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NAMES={1:["Stays on its own side at the start","Time out past its own boxes in the first 15 seconds or until first sight. Lower is better."],2:["Beats the easiest peeker","Real duels won, of the rounds where they met. Switch off."],3:["Beats an opponent holding where you stood","Real duels won against a bot at your spots, shooting back."],4:["Beats an opponent on the stone steps","The blind spot you found, all four outfits."],5:["Beats the roaming bot","Real duels won against the game's own bot."],6:["Aim practice","Aim arena kills, enemy placed in view, mixed outfits."],7:["Rounds where they never meet","Rounds that run out of time with under 1 second of sight of each other. Lower is better."]};
const pc=v=>Math.round(v*100),NS="http://www.w3.org/2000/svg";
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function icon(k){ // Linear-like status icons: done / in progress / todo
  const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 14 14");s.setAttribute("class","ic");
  const c=document.createElementNS(NS,"circle");c.setAttribute("cx",7);c.setAttribute("cy",7);c.setAttribute("r",6);c.setAttribute("fill","none");c.setAttribute("stroke-width",1.5);
  if(k==="g"){c.setAttribute("fill",C("--good"));c.setAttribute("stroke",C("--good"));s.append(c);const p=document.createElementNS(NS,"path");p.setAttribute("d","M4 7.2l2 2 4-4.2");p.setAttribute("fill","none");p.setAttribute("stroke",C("--bg"));p.setAttribute("stroke-width",1.6);p.setAttribute("stroke-linecap","round");s.append(p)}
  else if(k==="r"){c.setAttribute("stroke",C("--bad"));s.append(c);const p=document.createElementNS(NS,"path");p.setAttribute("d","M7 7V2.6A4.4 4.4 0 0 1 7 11.4z");p.setAttribute("fill",C("--bad"));s.append(p)}
  else{c.setAttribute("stroke",C("--wait"));c.setAttribute("stroke-dasharray","2 2.2");s.append(c)}
  return s}
function track(m,cls){
  const t=el("div","track"),P=v=>Math.max(0,Math.min(100,v*100))+"%";t.append(el("div","base"));
  const z=el("div","zone");if(m.how==="max"){z.style.left="0";z.style.width=P(m.target)}else{z.style.left=P(m.target);z.style.right="0"}t.append(z);
  const k=el("div","tick");k.style.left=P(m.target);t.append(k);
  if(m.before!=null&&m.after!=null){const l=el("div","link"),a=Math.min(m.before,m.after),b=Math.max(m.before,m.after);l.style.left=P(a);l.style.width=(b-a)*100+"%";l.style.background=C(cls==="g"?"--good":"--bad");t.append(l)}
  if(m.before!=null){const w=el("div","was");w.style.left=P(m.before);w.title="before: "+pc(m.before)+"%";t.append(w)}
  if(m.after!=null){const n=el("div","now");n.style.left=P(m.after);n.style.background=C(cls==="g"?"--good":"--bad");n.title="latest exam: "+pc(m.after)+"%";t.append(n)}
  t.title=`needs ${m.how==="max"?"at most":"at least"} ${pc(m.target)}%`;return t}
function spark(title,series,pts,max){
  const w=el("div"),cap=el("div","cap");cap.append(el("b",null,title));
  for(const s of series){const sp=el("span"),i=el("i","ln");i.style.background=s.col;sp.append(i,document.createTextNode(s.name));cap.append(sp)}
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("class","sp");svg.setAttribute("viewBox","0 0 300 84");svg.setAttribute("preserveAspectRatio","none");
  for(const g of [0,.5,1]){const l=document.createElementNS(NS,"line");l.setAttribute("x1",0);l.setAttribute("x2",300);l.setAttribute("y1",4+76*(1-g));l.setAttribute("y2",4+76*(1-g));l.setAttribute("stroke",C("--line"));l.setAttribute("stroke-width",1);svg.append(l)}
  for(const s of series){
    const raw=pts.map(p=>p[s.key]).map(v=>v==null?null:v/max),sm=[];let e=null;
    for(const v of raw){if(v!=null)e=e==null?v:e*.8+v*.2;sm.push(e)}
    const n=sm.length;let d="";sm.forEach((v,i)=>{if(v==null)return;d+=(d?"L":"M")+(n>1?i/(n-1)*300:150).toFixed(1)+" "+(4+76*(1-Math.min(1,v))).toFixed(1)});
    const p=document.createElementNS(NS,"path");p.setAttribute("d",d);p.setAttribute("fill","none");p.setAttribute("stroke",s.col);p.setAttribute("stroke-width",1.6);p.setAttribute("vector-effect","non-scaling-stroke");svg.append(p)}
  w.append(cap,svg);return w}
function bars(h,items,max,unit){const f=document.createDocumentFragment();f.append(el("div","bh",h));
  for(const [l,v,col] of items){const b=el("div","bar"),t=el("div","t"),i=el("i");i.style.width=(v==null?0:Math.min(100,v/max*100))+"%";i.style.background=col;t.append(i);b.append(el("div","l",l),t,el("div","v",v==null?"–":Math.round(v)+unit));f.append(b)}return f}
function render(s){
  const st=(s.peek||{}).status||{},marks=st.marks||[],run=s.run||{},tr=(s.processes||[]).find(p=>p.kind==="training");
  $("pulse").className="pulse"+(tr?" on":"");$("run").textContent=tr?(tr.name||run.name):"idle";$("upd").textContent=tr&&run.last?"update "+run.last:"";
  const ex=(s.processes||[]).filter(p=>p.kind==="duels"||p.kind==="exam").length,ec=$("examchip");ec.style.display=ex?"":"none";ec.textContent=ex+" exam"+(ex>1?"s":"")+" running";
  $("eng").textContent=(s.engines||0)+" engines";
  let g=0,r=0,w=0;const by={};for(const m of marks){(by[m.mark]=by[m.mark]||[]).push(m);m.after==null?w++:m.ok?g++:r++}
  const seg=$("seg");seg.replaceChildren();for(const [n,c] of [[g,"--good"],[r,"--bad"],[w,"--wait"]]){if(!n)continue;const i=el("i");i.style.flex=n;i.style.background=C(c);seg.append(i)}
  const cn=$("counts");cn.replaceChildren();for(const [n,c,l] of [[g,"--good","passing"],[r,"--bad","not yet"],[w,"--wait","not measured"]]){const sp=el("span"),d=el("i","dotl");d.style.background=C(c);sp.append(d,el("b",null,n),document.createTextNode(l));cn.append(sp)}
  $("nmarks").textContent=marks.length;
  const list=$("list");list.replaceChildren();
  const hd=el("div","hd"),hr=el("div","row");hr.append(el("i"),el("i"),el("span",null,"before"),el("span",null,"now"),el("span",null,"needs"));hd.append(el("i"),hr);list.append(hd);
  for(const k of Object.keys(by).sort()){
    const ms=by[k],all=ms.every(m=>m.after!=null),ok=all&&ms.every(m=>m.ok),none=ms.every(m=>m.after==null);
    const blk=el("div","mark"),nm=el("div","nm"),d=el("span","sdot");d.style.background=C(none?"--wait":ok?"--good":"--bad");
    nm.append(d,el("span",null,(NAMES[k]||[ms[0].name])[0]));nm.title=(NAMES[k]||["",""])[1];
    const right=el("div");
    for(const m of ms){
      const cls=m.after==null?"w":m.ok?"g":"r",row=el("div","row");
      const v=el("div","val "+cls,m.after==null?"–":pc(m.after)+"%");
      v.title=m.tag?`${m.tag}, ${m.rounds} rounds`:"no exam yet";
      const bf=el("div","num",m.before==null?"–":pc(m.before)+"%"),nd=el("div","num",(m.how==="max"?"≤ ":"≥ ")+pc(m.target)+"%");
      const tag=el("span","endtag",m.side==="T"?"usual end":"other end");tag.title=m.side==="T"?"the end it always played from":"the far end";
      row.append(tag,track(m,cls),bf,v,nd);right.append(row)}
    blk.append(nm,right);list.append(blk)}
  const rows=(st.baseline||{}).rows||[],own=rows.filter(x=>x.player==="OWNER"),vs=rows.filter(x=>/vs the owner/.test(x.player)),avg=(a,f)=>a.length?a.reduce((q,x)=>q+f(x),0)/a.length:null;
  const m1=(by["1"]||[]).filter(m=>m.after!=null),cmp=$("cmp");cmp.replaceChildren();
  cmp.append(bars("Time out past own boxes",[["You",avg(own,x=>x.past_line*100),C("--accent")],["Model before",avg(vs,x=>x.past_line*100),C("--wait")],["Model now",m1.length?avg(m1,x=>x.after*100):null,C("--good")]],60,"%"),
             bars("Speed while visible (run = 250)",[["You",avg(own,x=>x.speed_los),C("--accent")],["Model before",avg(vs,x=>x.speed_los),C("--wait")]],250,""));
  const pts=(run.points||[]).filter(p=>p.duel_win!=null||p.duel_past!=null),ch=$("charts");ch.replaceChildren();
  if(pts.length>1){const A=C("--text"),B=C("--accent");
    ch.append(spark("Duels won",[{name:"usual",key:"duel_win",col:A},{name:"other",key:"duel_CT_win",col:B}],pts,1),
              spark("Time past its line",[{name:"usual",key:"duel_past",col:A},{name:"other",key:"duel_CT_past",col:B}],pts,.6),
              spark("Won vs holder at your spots",[{name:"usual",key:"duel_hold_win",col:A},{name:"other",key:"duel_CT_hold_win",col:B}],pts,1))}
  else ch.append(el("div",null,"no training data yet"));
}
async function tick(){try{render(await(await fetch("/api/state",{cache:"no-store"})).json())}catch(e){$("pulse").className="pulse"}}
tick();setInterval(tick,5000);
</script></body></html>
